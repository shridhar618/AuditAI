version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: audit-postgres
    environment:
      POSTGRES_USER: audit_user
      POSTGRES_PASSWORD: audit_pass
      POSTGRES_DB: audit_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit_user -d audit_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.7.0
    container_name: audit-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=50051
      - QDRANT__SERVICE__HTTP_PORT=6333

  backend:
    build: ../backend
    container_name: audit-backend
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - qdrant
    environment:
      - DATABASE_URL=postgresql+psycopg2://audit_user:audit_pass@postgres:5432/audit_db
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    volumes:
      - ../backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ../frontend
    container_name: audit-frontend
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    environment:
      - VITE_PORT=3000
      - VITE_API_TARGET=http://backend:8000
    depends_on:
      - backend

volumes:
  pgdata:
  qdrant_storage:
